[project]
name = "product-image-api"
version = "1.0.0"
description = "Background removal and compression API for product images"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "pydantic-settings>=2.3.4,<3.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "pillow>=10.4.0,<11.0.0",
    "rembg>=2.0.57,<3.0.0",
    "onnxruntime>=1.18.0,<2.0.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120
